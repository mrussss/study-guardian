standby:
  first_study_active_minutes: 60
  repeat_reminder_minutes: 30

study:
  distraction_warn_minutes: 8
  distraction_strong_minutes: 15
  idle_static_warn_minutes: 20
  idle_static_strong_minutes: 30

break:
  warn_minutes: 20
  strong_minutes: 30
  repeat_minutes: 15

reminder:
  cooldown_minutes: 10
  quiet_periods:
    - start: "12:00"
      end: "14:00"
    - start: "17:30"
      end: "19:00"
    - start: "21:00"
      end: "24:00"

screen:
  enabled: true
  store_raw: false
  monitor: 0 # 0 = virtual desktop/all monitors; 1..N = physical monitor
  active_sample_seconds: 15
  unknown_sample_seconds: 5
  break_sample_seconds: 60

ipc:
  supervisor_host: "127.0.0.1"
  supervisor_port: 17321
  sensor_host: "127.0.0.1"
  sensor_port: 17322
  auth_token: ""

privacy:
  sensitive_apps:
    - "keepass"
    - "1password"
    - "bitwarden"
    - "credential"
    - "authenticator"
    - "wechatpay"
    - "alipay"
  sensitive_domains:
    - "bank"
    - "login"
    - "auth"
    - "checkout"
    - "accounts.google.com"

ai:
  schema_version: 2
  enabled: false
  use_vision_only_when_needed: true
  min_confidence: 0.75
  provider: "none" # enable and configure a real provider explicitly
  model: ""
  api_key: ""
  endpoint: ""
  text:
    provider: "none"
    model: ""
    base_url: ""
    api_key_env: ""
    api_key_file: ""
    timeout_seconds: 6
    json_mode: "auto"
    temperature: null
  vision:
    enabled: false
    provider: "none"
    model: ""
    base_url: ""
    api_key_env: ""
    api_key_file: ""
    timeout_seconds: 8
    json_mode: "auto"
    temperature: null

motivation:
  enabled: true
  default_daily_target_minutes: 120
  checkin_threshold_minutes: 30
  idle_static_credit_grace_seconds: 300
  ap_per_focus_hour_milli: 1000

review:
  enabled: true
  timezone: "local"
  provider:
    inherit_text_profile: true
    provider: ""
    model: ""
    base_url: ""
    api_key_env: ""
    api_key_file: ""
    timeout_seconds: 30
    json_mode: "auto"
    temperature: null
  trigger:
    off_debounce_minutes: 5
    backfill_previous_day: true
  retention:
    raw_chat_days: 30
    semantic_days: 180
  limits:
    max_turn_chars: 12000
    max_conversation_chars: 40000
    max_final_input_chars: 60000
